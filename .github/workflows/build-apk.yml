name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application Assets
        run: |
          npm ci
          npm run build:android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java string: $JAVA_VERSION_OUTPUT"
          
          # Extract major version number
          MAJOR_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$MAJOR_VERSION" ]; then
            echo "ERROR: Unable to detect Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Active Java version ($MAJOR_VERSION) is lower than the required minimum of 17."
            exit 1
          fi
          echo "Java version verification passed ($MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Setting up Temporary Debug Keystore ==="
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already present."
          fi
          
          if [ ! -f ./debug.keystore ]; then
            echo "ERROR: Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Generated APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk directory:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK exists but is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: $EXPECTED_APK does not have .apk extension."; exit 1 ;;
          esac

          FILE_SIZE=$(stat -c%s "$EXPECTED_APK")
          echo "APK successfully verified at: $EXPECTED_APK (Size: $FILE_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          echo "=== Preparing Release Asset ==="
          RUNNER_TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "${RUNNER_TMP_DIR}/app-debug.apk"
          
          if [ ! -s "${RUNNER_TMP_DIR}/app-debug.apk" ]; then
            echo "ERROR: Staged release asset is missing or empty."
            exit 1
          fi
          
          echo "asset_path=${RUNNER_TMP_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${RUNNER_TMP_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_FILE="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Asset file $ASSET_FILE not found or empty."
            exit 1
          fi

          BASENAME=$(basename "$ASSET_FILE")
          if [ "$BASENAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename is not app-debug.apk (got $BASENAME)"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}
          - Purpose: Testing and development preview
          - Notice: This is not a Google Play Store production release.
          - Signing: Signed with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG and marking --latest"
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --target "$TARGET_COMMIT" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Final APK Status Report ==="
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release successfully created!"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Asset Filename: app-debug.apk"
            echo "Direct APK Download URL: $DIRECT_URL"
            
            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📥 **Direct Download Link:** [$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset:** \`app-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** Actions artifact \`app-debug-apk\` is also available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation failed or was skipped."
            echo "Check if the workflow has write permissions or if gh token was sufficient."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The APK build itself SUCCEEDED."
              echo "The debug APK is safely preserved as the Actions artifact 'app-debug-apk'."
            fi
            echo "## Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Release publishing did not succeed, but the Actions artifact \`app-debug-apk\` is available." >> "$GITHUB_STEP_SUMMARY"
          fi
